<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg" x1="48" y1="40" x2="100" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="rg" x1="152" y1="40" x2="100" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="#0A0E1A"/>
  <!-- Convergence glow -->
  <rect width="200" height="200" rx="28" fill="url(#bgGlow)"/>

  <!--
    Two tapered arms forming a V.
    Left arm: tips at (48,40) and (100,156), center at (74,98), rotated -24.2°
    Right arm: tips at (152,40) and (100,156), center at (126,98), rotated +24.2°
  -->
  <ellipse cx="74" cy="98" rx="11" ry="63.55"
    transform="rotate(-24.2, 74, 98)"
    fill="url(#lg)"/>

  <ellipse cx="126" cy="98" rx="11" ry="63.55"
    transform="rotate(24.2, 126, 98)"
    fill="url(#rg)"/>
</svg>
